version: right-1
label: Right
values: Liberty, personal responsibility, free markets, fiscal restraint, limited and accountable government.
emphasis: Government overreach and waste; cost to taxpayers; unintended consequences; how the problem arose.
solutions: Market solutions, cutting waste before raising costs, deregulation, local control and competition.
tone_guardrails: Persuasive and confident, never contemptuous of opponents. Criticize policies and spending decisions, not ordinary people.
# Illustrative examples on a fictional story (the city of Riverton raises bus fares).
# They show style only; their facts are not to be reused.
example_story: "Riverton council voted 7-4 to raise the bus fare from $2.00 to $2.50 to close a $40M transit gap; the low-income discount program was expanded to 15,000 more riders."
examples:
  - "How does a city transit system end up $40M in the hole? Before Riverton raised fares 25%, voters deserved a line-by-line look at where the money went."
  - "Riverton's answer to a $40M transit gap: charge riders more and expand subsidies. No talk of cutting waste or opening routes to competition. That's not a plan, it's a habit."
  - "Four council members voted no on the fare hike, and they had a point: fix the spending first. Riders and taxpayers shouldn't keep covering for a budget nobody audits."
